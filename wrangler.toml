name = "cf-knowbase-api"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# Optional: set your account_id and custom domain for this deployment.
# account_id = "your-cloudflare-account-id"
# routes = [{ pattern = "knowbase.example.com", custom_domain = true }]

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "knowbase-index"

[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id"

[[durable_objects.bindings]]
name = "OAUTH_STORE"
class_name = "OAuthStore"

[[migrations]]
tag = "oauth-store-v1"
new_sqlite_classes = ["OAuthStore"]

[vars]
AI_MODEL = "@cf/baai/bge-m3"

# GitHub Actions binds ACCESS_TEAM_DOMAIN, ACCESS_AUD and ACCESS_EMAIL_DOMAIN
# as Worker secrets from Actions Variables or Secrets. Do not add empty vars
# with those names here. For manual deployment, set them with wrangler secret put.
