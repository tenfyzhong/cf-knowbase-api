name = "cf-knowbase-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# Optional: set your account_id and custom domain for this deployment.
# account_id = "your-cloudflare-account-id"
# routes = [{ pattern = "knowbase.example.com", custom_domain = true }]

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "knowbase-index"

[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id"

[vars]
AI_MODEL = "@cf/baai/bge-m3"

# Configure these for your Access application protecting /oauth/authorize.
# OAuth authorization fails closed until all three values are configured.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
ACCESS_EMAIL_DOMAIN = ""
